name: analysis

on:
  push:
    branches: [main]
    paths: ['analysis/**', '.github/workflows/analysis.yml']
  pull_request:
    paths: ['analysis/**', '.github/workflows/analysis.yml']

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
